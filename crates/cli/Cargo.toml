[package]
name = "space-station-cli"
description = "The `spacestation` command: a shell over the space-station crate — accounts, tables, space windows, notifications, keys, queries, daemon."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "spacestation"
path = "src/main.rs"

[dependencies]
space-station.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
