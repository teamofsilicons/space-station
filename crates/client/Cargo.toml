[package]
name = "space-station"
description = "The Space Station interface: record events, and manage orgs, tables, space windows, notifications and keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
space-station-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization"] }
