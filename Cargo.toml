[workspace]
resolver = "3"
members = ["crates/shared", "crates/client", "crates/cli", "crates/backend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/teamofsilicons/space-station"
homepage = "https://github.com/teamofsilicons/space-station"

[workspace.dependencies]
space-station-shared = { path = "crates/shared", version = "0.1.0" }
space-station = { path = "crates/client", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
